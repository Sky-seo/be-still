<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>be still</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #05050a;
      overflow: hidden;
      cursor: none;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #camera-canvas {
      opacity: 0;
      transition: opacity 180ms ease;
      z-index: 4;
    }
    #camera-canvas.is-visible {
      opacity: 0.72;
    }
    #paint-canvas {
      z-index: 1;
    }
    #debug-canvas {
      z-index: 6;
    }
    #hint {
      position: fixed;
      bottom: 14px;
      left: 16px;
      color: rgba(255,255,255,0.25);
      font: 12px -apple-system, sans-serif;
      pointer-events: none;
      z-index: 10;
    }
    #center-text {
      position: fixed;
      top: 24%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.9);
      font: 300 clamp(15px, 1.8vw, 28px) Georgia, 'Times New Roman', serif;
      letter-spacing: 0;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      z-index: 9;
      text-shadow: 0 1px 10px rgba(0,0,0,0.55);
      opacity: 1;
      transition: opacity 900ms ease;
    }
    #center-text.is-fading {
      opacity: 0;
    }
    #verse-text {
      position: fixed;
      top: 13%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(90vw, 1120px);
      color: rgba(255,255,255,0.96);
      text-align: center;
      pointer-events: none;
      z-index: 9;
      text-shadow: 0 2px 18px rgba(0,0,0,0.72);
      opacity: 0;
      transition: opacity var(--verse-fade-ms, 4400ms) ease;
    }
    #verse-text.is-visible {
      opacity: 1;
    }
    #verse-en {
      font: 300 clamp(26px, 3.2vw, 54px) Georgia, 'Times New Roman', serif;
      line-height: 1.35;
      letter-spacing: 0;
    }
    #verse-ko {
      margin-top: 38px;
      font: 300 clamp(16px, 1.75vw, 28px) 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      line-height: 1.35;
      letter-spacing: 0;
      color: rgba(255,255,255,0.78);
    }
    #verse-ref {
      margin-top: 12px;
      font: 400 clamp(12px, 1vw, 17px) -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.48);
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="paint-canvas"></canvas>
    <canvas id="camera-canvas"></canvas>
    <canvas id="debug-canvas"></canvas>
  </div>
  <div id="center-text">stay still</div>
  <div id="verse-text" aria-live="polite">
    <div id="verse-en"></div>
    <div id="verse-ko"></div>
    <div id="verse-ref"></div>
  </div>
  <div id="hint">d = debug &middot; s = camera &middot; f = fullscreen</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
